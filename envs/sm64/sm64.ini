[base]
env_name = sm64
checkpoint_interval = 50
eval_episodes = 20

# One agent is one Super Mario 64 in a process of its own, so this is how many
# copies of the game run at once. Each one keeps more than a core busy -- the
# game's threads, and the renderer's -- so throughput peaks at around half the
# core count and falls off above it: on a ten-core M4 Pro, eight games is about
# 9000 agent steps a second and sixteen is slower than that.
[vec]
total_agents = 8
num_buffers = 1
num_threads = 8

[env]
# Frames of the game per decision. The game runs at thirty a second, so two is
# fifteen decisions a second -- fast enough for a long jump's A and Z.
frameskip = 2
# Frames per episode: 450 is fifteen seconds. Much longer is wasted, because
# the castle grounds run out: a trained policy is about ten thousand units from
# the start after ten seconds and only a few hundred farther after fifteen.
max_ticks = 450
# Frames of a random direction held after loading the savestate. A few seconds
# of running puts each episode's start somewhere different on the grounds.
random_start = 120
# Units of distance per frame that are worth 1.0 of reward. Rewards are clipped
# at 1 per step of two frames, so this puts the ceiling at 100 units a frame --
# above a long jump's 48 and the 75 a diving policy reaches, so faster pays more.
speed_scale = 200.0
# Open a window and draw the game. For watching a policy, not for training.
window = 0

[train]
# About eighty minutes on an M4 Pro. The run these settings come from was
# still near its best at 13M steps and held there to 20M.
total_timesteps = 20_000_000
horizon = 128
minibatch_size = 512
# Keep exploring: fifty times puffer's default, annealed only to half of it.
# The run that learned to dive past the running speed ended with entropy still
# around 2.5. An earlier policy on a reward that paid for path length settled on
# a single action, entropy 0.003, and never pressed a button.
ent_coef = 0.05
anneal_ent_coef = 1
min_ent_coef_ratio = 0.5
