[base]
env_name = sm64
checkpoint_interval = 50
eval_episodes = 20

# One agent is one Super Mario 64 in a process of its own, so this is how many
# copies of the game run at once. Each one keeps more than a core busy -- the
# game's threads, and the renderer's -- so throughput peaks at around half the
# core count and falls off above it: on a ten-core M4 Pro, eight games is about
# 9000 agent steps a second and sixteen is slower than that.
#
# A step of a game is a message to it and a wait for the answer, so a thread
# stepping one is not doing any work. The usual rule, a thread per core, would
# leave most of the games stepping one after another: keep num_threads equal to
# total_agents, a thread per game.
[vec]
total_agents = 8
num_buffers = 1
num_threads = 8

[env]
# Which star: <course>-<number>, the way the act select numbers a course's stars,
# or a course alone for any star in it. pss-2 is Peach's Secret Slide's second,
# for reaching the bottom inside 21 seconds; wf-1 is Whomp's Fortress's first.
# `./build/sm64_tool courses` lists the courses. A star with settings of its own
# keeps them in stars/<star>.ini, which goes over this file (--config); `make
# sm64-train STAR=wf-1` picks one, and without STAR the Makefile trains this one.
star = pss-2
# The act the course is entered for. 0 is the star's own: stars 1 to 6 their own
# act, the hundred coins and "any star" act 1, and nothing for a course with no
# act select. Another act is a different set of objects in the course, and keeps
# its things apart from the star's own act's (build/sm64/bob-7-act3/).
act = 0
# Frames of the game per decision. The game runs at thirty a second, so two is
# fifteen decisions a second -- fast enough for a long jump's A and Z.
frameskip = 2
# Frames per episode: the time Mario has to get the star. 900 is thirty seconds.
# Every frame of it costs, so faster is better whatever this is, but it has to be
# long enough to get there at the pace an explorer does: the slide is about 1100
# frames at that pace, and stars/pss-2.ini gives it 1500.
max_ticks = 900
# Frames of a random direction held after loading the savestate. A few seconds
# of running puts each episode's start somewhere different. The clock starts
# after them.
random_start = 120
# Reward the whole clock costs, spent evenly frame by frame. An episode that
# takes the star at frame 450 has paid half of it, and the star pays 1. Not more
# than 1: a death or a warp pays what is left of it in one step, and a step is
# clipped at -1.
time_penalty = 1.0
# Novelty: the first time in an episode that Mario enters a cube of the course
# novelty_cell units a side, he is paid
#     novelty_episode + novelty / sqrt(episodes that have entered it)
# When the goal was the castle door, 12M steps of the door and the clock alone
# never found it. With only the fading part, it found the door by 100K steps and
# lost it by 500K, once the way there was worn out; the part that never fades
# keeps covering ground worth doing. 0.02 a cube is about what running costs in
# clock.
novelty = 0.05
novelty_episode = 0.02
novelty_cell = 500.0
# What a death costs. By default it ends the episode and pays whatever is left
# of the clock at once, so that dying is never cheaper than running the clock
# out. That is fine where Mario has to go out of his way to die, and wrong in a
# course he falls out of: in Whomp's Fortress 70% of episodes ended in a death,
# most of them in the first half of the clock, and each one explored a third of
# what a whole episode does. With respawn = 1 a death instead puts the game back
# at the savestate and the episode carries on with the clock where it was, so a
# death costs the time it wasted and the ground it gave up -- and is still not a
# way to stop the clock early.
respawn = 0
# Go-Explore: the share of episodes that start from a cube in the archive --
# replaying the shortest inputs that reached it, weighted to cubes few episodes
# have entered -- instead of where the task starts. With novelty alone, 10M
# steps swam the castle's moat and never learned the door. Set 0 to watch a
# policy from the real start only; the log's start_perf / from_start is that
# star rate.
go_explore = 0.5
# Of those, the share drawn from cubes some episode passed through on its way to
# the star, once any episode has. Starting from the rarest cubes alone spent 8M
# steps in the far corners of the castle's moat and lake, and the door opened
# once in a thousand.
go_explore_star = 0.5
# Start the archive with the runs on file -- the demo, the folder of the
# fastest, and seeds/ -- instead of with nothing: each is played through once as
# the games start, its cubes kept and credited as on the way to the star.
# Without it a run spends its first ten minutes finding the way again, and what
# two runs found never meets. 0 is an archive that starts empty.
go_explore_seed = 0
# Racing the archive. The first time in an episode Mario enters a cube that has
# been on the way to the star, on the ground and sooner than the archive's way
# into it, he is paid this much a frame of the difference, 0.1 at most. The
# archive then keeps his way, so only a run faster than any before is paid. The
# clock alone pays 0.02 for thirty frames, and only at the star. 0 is no ghost;
# it needs go_explore on, and go_explore_seed to have anything to race at first.
ghost = 0.0
# Go-Explore's second phase, robustifying: the share of episodes that start on
# the fastest run to the star on file (build/sm64/<star>/fastest.demo), a little
# before a frontier that moves back from the star as the policy learns to take
# it from there. 0 is off. `make sm64-robustify` turns it on, and novelty and the
# archive off, so the reward is only the star and the clock.
backward = 0.0
# Frames the frontier moves back at a time: one second.
backward_step = 30
# The share of a window of episodes started from the frontier that must take
# the star before it moves back.
backward_rate = 0.5
# Where the frontier begins, in frames before the star: 0 is backward_step. A
# run that carries on from another's checkpoint (load_model_path) can start its
# frontier where that run's got to rather than working back to it again.
backward_start = 0
# Open a window and draw the game. For watching a policy, not for training.
window = 0
# Show the policy the game: its picture, shrunk to this many pixels, goes into
# the observation after Mario's state, and the policy puts it through a small
# convolutional net. The picture comes from the console's own video interface,
# not from anything in Super Mario 64's memory. 0 is no picture. With one, a
# game draws its frames, and eight of them step about 2500 times a second
# instead of 9000.
picture_width = 0
picture_height = 0
# Mario's state -- position, velocity, what he is doing -- read out of the
# game's memory into the observation. 0 leaves those numbers zero but the clock,
# so a policy with a picture sees the picture and how much time is left. The
# reward still reads memory either way.
state = 1

[train]
# About seventy minutes on an M4 Pro, at the 4900 steps a second thirty-second
# episodes train at.
total_timesteps = 20_000_000
horizon = 128
minibatch_size = 512
# Muon's updates are the same size however little the gradient says, so with no
# reward to learn from the weights random-walk until they blow up: the first
# door-or-nothing run did at 3.4M steps. Decay holds them near their starting
# size, where a step of 0.015 in a random direction and 0.015 * 0.01 of the
# weights taken back balance.
weight_decay = 0.01
# Entropy is held at a target rather than bought at a fixed price, because no
# fixed price worked on the castle door, the clock and novelty. At 0.05 the
# policy sat at exactly uniform (entropy 4.913 = ln 17 + 3 ln 2) from 0.7M to
# 1.8M steps with nothing learned, and exploration stopped at the 960 cubes
# random stick reaches. At 0.005 it learned to go out onto the bridge within
# 350K steps, then collapsed to entropy 0 by 1M: a routine that barely moved,
# which never finds anything new for novelty to pay.
#
# So ent_coef is where the coefficient starts, and the trainer moves it by a
# factor of e for every 1 / (ent_coef_rate * gap) epochs that entropy is off
# target_entropy -- about half of the most it can be.
ent_coef = 0.01
target_entropy = 2.5
ent_coef_rate = 0.01
# The same gap, added to the coefficient directly as well as summed: a factor of
# e for every 1 / ent_coef_damping of entropy off target. 0 is the sum alone,
# which holds a run that seldom scores. With the archive seeded from the runs on
# file, a run scores from its first minute, entropy answers the coefficient late
# and with hysteresis, and the sum alone cycled it between 0.3 and 4.6 every
# 700K steps: playing at random, then not exploring at all.
ent_coef_damping = 0
anneal_ent_coef = 1
min_ent_coef_ratio = 0.5
# Normalize each minibatch's advantages, as PufferLib 4.0 did and 5.0 does not.
# Off, so the trainer is 5.0's. On for robustifying the slide, which learned
# nothing at all without it: with only a star at the end paying, advantages
# are a tenth the size of the value error, and in 1.5M steps entropy rose to
# 4.90 of a possible 4.91. Normalized, the same run learns. See the README.
norm_adv = 0
