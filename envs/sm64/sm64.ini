[base]
env_name = sm64
checkpoint_interval = 50
eval_episodes = 20

# One agent is one Super Mario 64 in a process of its own, so this is how many
# copies of the game run at once. Each one keeps more than a core busy -- the
# game's threads, and the renderer's -- so throughput peaks at around half the
# core count and falls off above it: on a ten-core M4 Pro, eight games is about
# 9000 agent steps a second and sixteen is slower than that.
[vec]
total_agents = 8
num_buffers = 1
num_threads = 8

[env]
# Frames of the game per decision. The game runs at thirty a second, so two is
# fifteen decisions a second -- fast enough for a long jump's A and Z.
frameskip = 2
# Frames per episode: 1800 is a minute of game time.
max_ticks = 1800
# Frames of a random direction held after loading the savestate, so that every
# episode does not start identically.
random_start = 8
# Units of distance per frame that are worth 1.0 of reward. A long jump covers
# about 48 a frame, so a step of two frames at full tilt is worth about one.
speed_scale = 100.0
# Open a window and draw the game. For watching a policy, not for training.
window = 0

[train]
total_timesteps = 5_000_000
horizon = 128
minibatch_size = 512
# Keep exploring. The reward is dense and "hold forward" is a decent policy
# almost immediately, so at the usual 0.01 the entropy collapses to nothing by
# 500k steps and the run settles for a jog: 13.5 units a frame. At 0.05,
# annealed, it is still trying things at a million steps and ends at 16.4.
ent_coef = 0.05
anneal_ent_coef = 1
