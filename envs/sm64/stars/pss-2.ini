# Peach's Secret Slide, star 2: reach the bottom inside 21 seconds of the slide's
# own timer, and the star spawns there. Every slide run on file takes this one,
# star 1 being the box at the bottom that none of them breaks. Gravity does most
# of the work, and the way to lose is to go over the side.
[env]
star = pss-2
# The slide is about 1100 frames long at the pace an explorer slides it, so no
# episode fit the star into the 900-frame clock. Every frame of this one still
# costs.
max_ticks = 1500
# Going over the side keeps the clock and puts the game back at the top, rather
# than ending the episode.
respawn = 1
