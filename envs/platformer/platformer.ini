[base]
env_name = platformer
checkpoint_interval = 50
eval_episodes = 100

[vec]
total_agents = 1024
num_buffers = 1
num_threads = 8

[env]
frameskip = 2
max_ticks = 1800
death_penalty = 0.5

[policy]
hidden_size = 128
num_layers = 2

# Stateless policy: the torch backend's eval resets recurrent state every step
[torch]
network = MLP

[train]
total_timesteps = 50_000_000
ent_coef = 0.01
