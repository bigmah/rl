# Super Mario 64, Peach's Secret Slide, on PufferLib 5.0's CUDA trainer.
# Read over config/default.ini (PufferLib's own) from the directory ./puffer runs
# in. Any key can be overridden on the command line: --train.learning-rate=0.01
[base]
env_name = sm64
checkpoint_interval = 50
eval_episodes = 64

# One agent is one Super Mario 64 in a process of its own, so total_agents is how
# many copies of the game run at once. Each keeps a bit more than a core busy, so
# throughput peaks at around half the machine's cores: 32 on a 72-core Grace.
# Stepping a game is a message to its process and a wait, so give every game a
# thread of its own: num_threads = total_agents.
#
# The trainer needs total_agents * horizon >= minibatch_size, and total_agents
# divisible by minibatch_size / horizon. With horizon 64 and minibatch 1024 that
# is any multiple of 16. At 64 agents, raise minibatch_size to 2048 or 4096.
[vec]
total_agents = 32
num_buffers = 2
num_threads = 32

[env]
# Which star: <course>-<number>. pss-2 is Peach's Secret Slide's second star,
# which spawns at the bottom for reaching it inside 21 seconds of the slide's
# own timer, and is his the frame he touches it.
star = pss-2
# The act the course is entered for; 0 is the star's own.
act = 0
# Where that star is. Every run on file touches it within 150 units of here.
# This is the only thing the reward knows about the course.
star_x = -6358
star_y = -4300
star_z = 4700
# Frames of the game per decision; the game runs at thirty a second.
frameskip = 2
# Frames per episode. The fastest run on file touches the star at 674 frames; a
# slide at an explorer's pace is about 1100.
max_ticks = 1500
# At most this many frames of a random stick direction after loading the
# savestate, so episodes do not all start the same.
random_start = 30
# Reward the whole clock costs, spent a frame at a time. A death pays what is
# left of it at once.
time_penalty = 0.5
# Reward the whole way to the star is worth, paid as Mario first gets closer than
# he has been this episode (while there is floor under him). The star itself pays 1.
progress = 1.0
# Open a window and draw the game, for watching a policy. Needs the renderer
# (SM64_RENDERER=1 at build time) and a display.
window = 0

[policy]
hidden_size = 256
num_layers = 4

[train]
total_timesteps = 50_000_000
horizon = 64
minibatch_size = 1024
learning_rate = 0.01
gamma = 0.995
gae_lambda = 0.95
ent_coef = 0.005
