# The 2D platformer: run right, clear the pits and spikes, touch the flag. A
# small, fast env for checking the trainer and the GPU work before the game.
# On main's wgpu port of this same trainer, 20M steps reached the flag in 99.7%
# of episodes (45 seconds on an M4 Pro).
[base]
env_name = platformer
checkpoint_interval = 50

[vec]
total_agents = 1024
num_buffers = 1
num_threads = 8

[env]
frameskip = 2
max_ticks = 1800
fail_penalty = 0.1

[train]
total_timesteps = 20_000_000
